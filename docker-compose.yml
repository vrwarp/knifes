services:
  section30:
    build: .
    image: section30:latest
    container_name: section30
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # SQLite, uploads, Agent SDK sessions and the Claude login all live here.
      # A named volume keeps the ownership the image set for the non-root user.
      # To use a host folder instead: `- ./data:/data` plus `chown -R 1001:1001 ./data`.
      - section30-data:/data
    mem_limit: 2g

volumes:
  section30-data:
